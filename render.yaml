services:
  - type: web
    name: bmi-app
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT --workers 2 --log-level info
    healthCheckPath: /readyz
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
